<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - RoomSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        .custom-input:focus {
            border-color: #004CFF !important;
            box-shadow: 0 0 0 3px rgba(0, 76, 255, 0.08) !important;
        }
    </style>
</head>
<body class="bg-gray-50 lg:bg-white text-gray-900 antialiased font-sans min-h-screen">

    <div class="min-h-screen w-full flex flex-col items-center justify-center lg:flex-row lg:items-stretch lg:justify-start">
        <!-- FORM CONTAINER -->
        <div class="w-full flex-1 flex flex-col items-center justify-center px-5 py-12 lg:p-0 lg:w-[480px] lg:flex-none lg:border-r lg:border-gray-100 lg:bg-white">
            <div class="w-full max-w-[390px] bg-white rounded-2xl px-8 py-10 shadow-[0_4px_24px_rgba(0,0,0,0.07)] lg:max-w-[360px] lg:rounded-none lg:shadow-none lg:p-0">
                
                <!-- LOGO -->
                <div class="flex items-center gap-2.5 mb-8">
                    <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background-color: #004CFF;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="4" width="18" height="16" rx="2" stroke="white" stroke-width="2" />
                            <path d="M8 2v4M16 2v4M3 10h18" stroke="white" stroke-width="2" stroke-linecap="round" />
                            <circle cx="8.5" cy="15" r="1.5" fill="white" />
                            <circle cx="12" cy="15" r="1.5" fill="white" />
                            <circle cx="15.5" cy="15" r="1.5" fill="white" />
                        </svg>
                    </div>
                    <span class="text-[15px] font-semibold text-gray-900 tracking-tight">RoomSync</span>
                </div>

                <!-- TITLE -->
                <div class="mb-8">
                    <h1 class="text-[26px] leading-tight text-gray-900 tracking-tight font-bold">
                        Đăng nhập vào tài khoản
                    </h1>
                    <p class="mt-1.5 text-sm text-gray-500">
                        Chào mừng trở lại. Nhập thông tin đăng nhập để tiếp tục.
                    </p>
                </div>

                <!-- FORM -->
                <form id="loginForm" onsubmit="handleSplitLogin(event)" class="w-full">
                    <div class="mb-6">
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">
                            Email công ty
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-3.5 flex items-center text-gray-400 pointer-events-none">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            </span>
                            <input type="text" id="username" name="username" placeholder="admin@congty.com" required value="admin@congty.com" class="custom-input w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-200 text-sm text-gray-900 placeholder-gray-400 bg-white transition-colors outline-none" />
                        </div>
                    </div>

                    <div class="mb-6">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">
                            Mật khẩu
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-3.5 flex items-center text-gray-400 pointer-events-none">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            </span>
                            <input type="password" id="password" name="password" placeholder="••••••••" required value="123456" class="custom-input w-full pl-10 pr-11 py-2.5 rounded-lg border border-gray-200 text-sm text-gray-900 placeholder-gray-400 bg-white transition-colors outline-none" />
                            <button type="button" id="togglePassword" class="absolute inset-y-0 right-3.5 flex items-center text-gray-400 hover:text-gray-600">
                                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mb-6">
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="rememberMe" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                            <span class="text-sm text-gray-600">Ghi nhớ đăng nhập</span>
                        </label>
                        <a href="#" class="text-sm font-medium text-[#004CFF] hover:text-[#0038CC]">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="w-full py-3 rounded-lg text-sm font-semibold text-white bg-[#004CFF] hover:bg-[#0038CC]">
                        Đăng Nhập
                    </button>
                </form>
            </div>
        </div>

        <!-- BANNER RIGHT -->
        <div class="hidden lg:flex flex-1 relative overflow-hidden" style="background-color: #001A66;">
            <img src="https://images.unsplash.com/photo-1740933084056-078fac872bff?w=1200&h=900&fit=crop&auto=format" alt="Phòng họp" class="absolute inset-0 w-full h-full object-cover opacity-45" />
            <div class="absolute inset-0 bg-gradient-to-br from-[#004CFF]/35 to-[#000A3C]/70"></div>
            <div class="absolute inset-0 flex flex-col justify-end p-14 text-white">
                <h2 class="text-3xl font-semibold mb-3">Đặt đúng phòng họp, mọi lúc bạn cần.</h2>
                <p class="text-sm text-white/60 max-w-sm">RoomSync giúp đội nhóm nắm rõ tình trạng phòng họp — đặt lịch và quản lý tại một nơi duy nhất.</p>
            </div>
        </div>
    </div>

    <script>
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
            });
        }

        function handleSplitLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            localStorage.setItem('token', 'mock-jwt-token-12345');
            localStorage.setItem('user_name', username.includes('admin') ? 'Quản trị viên' : 'Nguyễn Văn Hải');
            localStorage.setItem('role', username.includes('admin') ? 'admin' : 'user');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
