<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2563EB">
  <title>Kích hoạt tài khoản | RoomSync</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/pwa.css">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 32px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 8px 24px rgb(15 23 42 / 6%); }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #475569; line-height: 1.55; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 6px; font-size: .9rem; font-weight: 600; }
    input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; color: inherit; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid rgb(37 99 235 / 25%); outline-offset: 2px; border-color: #2563eb; }
    button { min-height: 44px; margin-top: 4px; padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    [role="alert"], [role="status"] { margin-top: 16px; }
    [role="alert"] { color: #b91c1c; }
    [role="status"] { color: #166534; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>Kích hoạt tài khoản RoomSync</h1>
    <p>Nhập email và mật khẩu tạm trong thư mời, sau đó đặt mật khẩu mới để kích hoạt tài khoản.</p>
    <form id="changePasswordForm">
      <label for="activationEmail">Email đăng ký
        <input id="activationEmail" name="email" type="email" autocomplete="email" required maxlength="150">
      </label>
      <label for="currentPassword">Mật khẩu hiện tại (mật khẩu tạm)
        <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" required maxlength="128">
      </label>
      <label for="newPassword">Mật khẩu mới
        <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="6" required maxlength="128">
      </label>
      <label for="confirmPassword">Xác nhận mật khẩu mới
        <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required maxlength="128">
      </label>
      <button id="changePasswordSubmit" type="submit">Đổi mật khẩu &amp; kích hoạt</button>
    </form>
    <p id="changePasswordError" role="alert" hidden></p>
    <p id="changePasswordSuccess" role="status" hidden></p>
    <noscript>Trang kích hoạt cần JavaScript để gửi yêu cầu đổi mật khẩu.</noscript>
  </main>
  <script src="js/change-password.js"></script>
  <script src="js/pwa.js?v=1"></script>
</body>
</html>
