<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomSync - Đăng nhập</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-logo">
                <div class="logo-icon">RS</div>
                <h2>RoomSync</h2>
            </div>

            <h3 style="font-size: 20px; margin-bottom: 4px;">Đăng nhập vào tài khoản</h3>
            <p style="color: #64748b; font-size: 13px; margin-bottom: 20px;">Chào mừng trở lại. Nhập thông tin để tiếp tục.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email công ty</label>
                    <input type="email" id="email" class="form-control" placeholder="ten@congty.com" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 20px;">
                    <label><input type="checkbox"> Ghi nhớ đăng nhập</label>
                    <a href="#" style="color: #2563eb; text-decoration: none;">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-primary">Đăng Nhập</button>
            </form>

            <p style="text-align: center; font-size: 12px; color: #64748b; margin-top: 20px;">
                Chưa có tài khoản? <a href="#" style="color: #2563eb;">Liên hệ quản trị viên</a>
            </p>
        </div>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 24px;">© 2026 RoomSync Inc. Bảo lưu mọi quyền.</p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
